<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism Evaluation Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    color: #1a1a1a;
    font-family: 'Times New Roman', 'Nimbus Roman', Georgia, serif;
    padding: 48px 64px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #555;
    margin-bottom: 36px;
    font-style: italic;
  }
  .figures {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px 48px;
  }
  .figure { }
  .figure-wide { grid-column: 1 / -1; }
  .chart-box {
    border: 1px solid #ccc;
    padding: 16px 20px 12px;
    background: #fff;
  }
  .chart-container {
    position: relative;
    width: 100%;
    height: 300px;
  }
  .chart-container.short { height: 260px; }
  .chart-container.tall { height: 340px; }
  figcaption {
    font-size: 12.5px;
    line-height: 1.5;
    margin-top: 10px;
    color: #333;
  }
  figcaption strong { font-weight: 700; }

  .results-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 4px;
  }
  .results-table th, .results-table td {
    border: 1px solid #bbb;
    padding: 6px 10px;
    text-align: center;
  }
  .results-table th {
    background: #f0f0f0;
    font-weight: 700;
    font-size: 12px;
  }
  .results-table td:first-child {
    text-align: left;
    font-weight: 600;
  }
  .results-table .best {
    font-weight: 700;
    color: #c0392b;
  }
</style>
</head>
<body>

<h1>Multi-Agent Adversarial Pipeline for Portfolio Impact Analysis</h1>
<p class="subtitle">3-way evaluation on 25 historical macro events with ground-truth 5-day returns (Yahoo Finance)</p>

<div class="figures">

  <!-- Figure 1: Radar -->
  <figure class="figure">
    <div class="chart-box">
      <div class="chart-container">
        <canvas id="radarChart"></canvas>
      </div>
    </div>
    <figcaption><strong>Figure 1.</strong> Quality dimension scores (0&ndash;5, LLM-as-judge). The multi-agent pipeline achieves near-ceiling scores on causal reasoning (4.9), risk identification (5.0), and recommendation quality (4.6), compared to single-agent baselines scoring &le;3.0 on all dimensions except calibration.</figcaption>
  </figure>

  <!-- Figure 2: Grouped bar -->
  <figure class="figure">
    <div class="chart-box">
      <div class="chart-container">
        <canvas id="barChart"></canvas>
      </div>
    </div>
    <figcaption><strong>Figure 2.</strong> Quality score comparison across all six evaluation dimensions. Single-agent models (Flash and Pro) show structural inability to identify risks or generate recommendations, scoring 0.0&ndash;0.3. Multi-agent overall score: 4.2/5 vs 1.5/5.</figcaption>
  </figure>

  <!-- Figure 3: Event type breakdown (multi-agent) -->
  <figure class="figure">
    <div class="chart-box">
      <div class="chart-container tall">
        <canvas id="eventTypeChart"></canvas>
      </div>
    </div>
    <figcaption><strong>Figure 3.</strong> Directional accuracy by event category (multi-agent). The pipeline achieves 100% accuracy on CPI surprises, oil shocks, geopolitical events, and currency shocks. Banking stress events (33%) remain challenging due to mixed cross-asset dynamics.</figcaption>
  </figure>

  <!-- Figure 4: Improvement vs best single-agent -->
  <figure class="figure">
    <div class="chart-box">
      <div class="chart-container tall">
        <canvas id="improvementChart"></canvas>
      </div>
    </div>
    <figcaption><strong>Figure 4.</strong> Score improvement from single-agent baseline (best of Flash/Pro) to multi-agent pipeline. Largest gains in risk identification (+4.7) and recommendation quality (+4.6), which require architectural capabilities absent from single-agent systems.</figcaption>
  </figure>

  <!-- Table: Full results -->
  <figure class="figure-wide">
    <table class="results-table">
      <thead>
        <tr>
          <th>Metric</th>
          <th>Single-Agent<br>(Gemini 2.5 Flash)</th>
          <th>Single-Agent<br>(Gemini 2.5 Pro)</th>
          <th>Multi-Agent<br>(10+ agents, Flash)</th>
          <th>&Delta; vs Best<br>Single-Agent</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Directional Accuracy</td><td>92%</td><td>84%</td><td class="best">88%</td><td>-4%</td></tr>
        <tr><td>Range Coverage</td><td>36%</td><td>48%</td><td class="best">68%</td><td>+20%</td></tr>
        <tr><td>Causal Reasoning (0-5)</td><td>3.0</td><td>2.9</td><td class="best">4.9</td><td>+1.9</td></tr>
        <tr><td>Calibration (0-5)</td><td>2.5</td><td>2.5</td><td>2.4</td><td>&minus;0.1</td></tr>
        <tr><td>Risk Identification (0-5)</td><td>0.3</td><td>0.1</td><td class="best">5.0</td><td>+4.7</td></tr>
        <tr><td>Recommendation Quality (0-5)</td><td>0.0</td><td>0.0</td><td class="best">4.6</td><td>+4.6</td></tr>
        <tr><td>Transparency (0-5)</td><td>1.9</td><td>1.9</td><td class="best">4.3</td><td>+2.4</td></tr>
        <tr><td><strong>Overall (0-5)</strong></td><td>1.5</td><td>1.5</td><td class="best">4.2</td><td><strong>+2.7</strong></td></tr>
      </tbody>
    </table>
    <figcaption><strong>Table 1.</strong> Full evaluation across 25 historical macro events (6 categories). Quality dimensions scored 0&ndash;5 by Gemini 3 Flash Preview as LLM-as-judge (anonymized System A/B/C). Directional accuracy validated against real 5-day returns from Yahoo Finance. All systems use Gemini 2.5 Flash to isolate the effect of multi-agent architecture from model capability. Best scores in <span style="color:#c0392b;font-weight:700">bold red</span>. We also evaluated TradingAgents (Columbia/NYU, 30k+ &#9733;), an open-source multi-agent trading framework, which scored comparably to single-agent baselines (1.5/5 overall on a 10-event subset), confirming that multi-agent debate alone is insufficient &mdash; the architecture must be purpose-built for the domain.</figcaption>
  </figure>

</div>

<script>
// Color palette
const BLUE    = '#1f77b4';
const ORANGE  = '#ff7f0e';
const GRAY    = '#7f7f7f';
const GRAY_LT = '#aec7e8';
const RED     = '#d62728';

Chart.defaults.color = '#333';
Chart.defaults.borderColor = '#ddd';
Chart.defaults.font.family = "'Helvetica Neue', Helvetica, Arial, sans-serif";
Chart.defaults.font.size = 12;

// ── Figure 1: Radar ──────────────────────────────────────────
new Chart(document.getElementById('radarChart'), {
  type: 'radar',
  data: {
    labels: ['Causal\nReasoning', 'Calibration', 'Risk\nIdentification', 'Rec.\nQuality', 'Transparency'],
    datasets: [
      {
        label: 'Single (Flash)',
        data: [3.0, 2.5, 0.3, 0.0, 1.9],
        borderColor: GRAY,
        backgroundColor: 'rgba(127,127,127,0.05)',
        pointBackgroundColor: GRAY,
        borderWidth: 1.5,
        pointRadius: 3,
        borderDash: [6, 3],
      },
      {
        label: 'Single (Pro)',
        data: [2.9, 2.5, 0.1, 0.0, 1.9],
        borderColor: ORANGE,
        backgroundColor: 'rgba(255,127,14,0.05)',
        pointBackgroundColor: ORANGE,
        borderWidth: 1.5,
        pointRadius: 3,
        borderDash: [3, 3],
      },
      {
        label: 'Multi-Agent Pipeline',
        data: [4.9, 2.4, 5.0, 4.6, 4.3],
        borderColor: BLUE,
        backgroundColor: 'rgba(31,119,180,0.12)',
        pointBackgroundColor: BLUE,
        borderWidth: 2.5,
        pointRadius: 5,
      },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      r: {
        beginAtZero: true,
        max: 5,
        ticks: { stepSize: 1, font: { size: 10 }, backdropColor: '#fff' },
        pointLabels: { font: { size: 11, weight: '600' }, color: '#222' },
        grid: { color: '#e0e0e0' },
        angleLines: { color: '#e0e0e0' },
      },
    },
    plugins: {
      legend: {
        position: 'bottom',
        labels: { padding: 14, usePointStyle: true, pointStyle: 'circle', font: { size: 11 } },
      },
    },
  },
});

// ── Figure 2: Grouped Bar ────────────────────────────────────
new Chart(document.getElementById('barChart'), {
  type: 'bar',
  data: {
    labels: ['Causal\nReasoning', 'Calibration', 'Risk\nIdentif.', 'Rec.\nQuality', 'Transparency', 'Overall'],
    datasets: [
      {
        label: 'Single (Flash)',
        data: [3.0, 2.5, 0.3, 0.0, 1.9, 1.5],
        backgroundColor: GRAY_LT,
        borderColor: GRAY,
        borderWidth: 1,
        borderRadius: 2,
        barPercentage: 0.8,
        categoryPercentage: 0.82,
      },
      {
        label: 'Single (Pro)',
        data: [2.9, 2.5, 0.1, 0.0, 1.9, 1.5],
        backgroundColor: ORANGE,
        borderColor: '#e06600',
        borderWidth: 1,
        borderRadius: 2,
        barPercentage: 0.8,
        categoryPercentage: 0.82,
      },
      {
        label: 'Multi-Agent',
        data: [4.9, 2.4, 5.0, 4.6, 4.3, 4.2],
        backgroundColor: BLUE,
        borderColor: '#185a8c',
        borderWidth: 1,
        borderRadius: 2,
        barPercentage: 0.8,
        categoryPercentage: 0.82,
      },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      y: {
        beginAtZero: true, max: 5,
        ticks: { stepSize: 1 },
        grid: { color: '#e8e8e8' },
        title: { display: true, text: 'Score (0–5)', font: { size: 12 } },
      },
      x: { grid: { display: false }, ticks: { font: { size: 10.5 } } },
    },
    plugins: {
      legend: {
        position: 'bottom',
        labels: { padding: 14, usePointStyle: true, pointStyle: 'rectRounded', font: { size: 11 } },
      },
    },
  },
});

// ── Figure 3: Event Type (Multi-Agent only) ──────────────────
new Chart(document.getElementById('eventTypeChart'), {
  type: 'bar',
  data: {
    labels: ['Rate\nDecisions', 'CPI\nSurprises', 'Oil/\nCommodity', 'Banking\nStress', 'Geo-\npolitical', 'Currency\n/FX'],
    datasets: [
      {
        label: 'Directional Accuracy',
        data: [88, 100, 100, 33, 100, 100],
        backgroundColor: BLUE,
        borderColor: '#185a8c',
        borderWidth: 1,
        borderRadius: 2,
        barPercentage: 0.7,
        categoryPercentage: 0.75,
      },
      {
        label: 'Range Coverage',
        data: [50, 50, 75, 100, 100, 67],
        backgroundColor: RED,
        borderColor: '#a11e20',
        borderWidth: 1,
        borderRadius: 2,
        barPercentage: 0.7,
        categoryPercentage: 0.75,
      },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      y: {
        beginAtZero: true, max: 100,
        ticks: { callback: v => v + '%', stepSize: 20 },
        grid: { color: '#e8e8e8' },
        title: { display: true, text: 'Percentage (%)', font: { size: 12 } },
      },
      x: { grid: { display: false }, ticks: { font: { size: 10.5 } } },
    },
    plugins: {
      legend: {
        position: 'bottom',
        labels: { padding: 14, usePointStyle: true, pointStyle: 'rectRounded', font: { size: 11 } },
      },
    },
  },
});

// ── Figure 4: Improvement vs Best Single-Agent ───────────────
new Chart(document.getElementById('improvementChart'), {
  type: 'bar',
  data: {
    labels: ['Causal\nReasoning', 'Risk\nIdentif.', 'Rec.\nQuality', 'Transparency', 'Overall'],
    datasets: [
      {
        label: 'Best Single-Agent',
        data: [3.0, 0.3, 0.0, 1.9, 1.5],
        backgroundColor: GRAY_LT,
        borderColor: GRAY,
        borderWidth: 1,
        borderRadius: 2,
        barPercentage: 0.7,
        categoryPercentage: 0.75,
      },
      {
        label: 'Multi-Agent Pipeline',
        data: [4.9, 5.0, 4.6, 4.3, 4.2],
        backgroundColor: BLUE,
        borderColor: '#185a8c',
        borderWidth: 1,
        borderRadius: 2,
        barPercentage: 0.7,
        categoryPercentage: 0.75,
      },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    indexAxis: 'y',
    scales: {
      x: {
        beginAtZero: true, max: 5,
        ticks: { stepSize: 1 },
        grid: { color: '#e8e8e8' },
        title: { display: true, text: 'Score (0–5)', font: { size: 12 } },
      },
      y: { grid: { display: false }, ticks: { font: { size: 11, weight: '600' } } },
    },
    plugins: {
      legend: {
        position: 'bottom',
        labels: { padding: 20, usePointStyle: true, pointStyle: 'rectRounded', font: { size: 11 } },
      },
    },
  },
});
</script>
</body>
</html>
